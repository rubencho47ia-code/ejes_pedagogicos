<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Informe de actividad pedagógica</title>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f6fb;--card:#fff;--text:#1d2433;--muted:#5b6578;--line:#d8deea;--accent:#2457c5;--accent-t:#fff;--danger:#b42318;--soft:#e9effc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1b2030;--text:#e8ecf5;--muted:#9aa5bd;--line:#2d3550;--accent:#6c97f5;--accent-t:#0b1020;--danger:#ff8a80;--soft:#232b45;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1b2030;--text:#e8ecf5;--muted:#9aa5bd;--line:#2d3550;--accent:#6c97f5;--accent-t:#0b1020;--danger:#ff8a80;--soft:#232b45;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
main{max-width:760px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.5rem;margin:8px 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
label{display:block;font-weight:600;margin:0 0 6px}
.hint{font-weight:400;color:var(--muted);font-size:.85rem}
.field{margin-bottom:16px}.field:last-child{margin-bottom:0}
input[type=text],textarea{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:96px;resize:vertical}
#desarrollo{min-height:200px}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.row{grid-template-columns:1fr}}
.drop{display:block;border:2px dashed var(--line);border-radius:12px;padding:20px;text-align:center;cursor:pointer;color:var(--muted);background:var(--soft)}
.drop:hover{border-color:var(--accent)}
.drop input{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:14px}
.ph{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.ph img{display:block;width:100%;height:110px;object-fit:cover}
.ph input{border:0;border-top:1px solid var(--line);border-radius:0;font-size:.85rem;padding:7px 9px}
.ph button{width:100%;border:0;border-top:1px solid var(--line);background:transparent;color:var(--danger);font:inherit;font-size:.85rem;padding:6px;cursor:pointer}
.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 20px;cursor:pointer;background:var(--accent);color:var(--accent-t)}
.btn.sec{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn:disabled{opacity:.6;cursor:wait}
.actions{display:flex;gap:10px;flex-wrap:wrap}
#msg{margin-top:12px;min-height:1.4em;font-size:.95rem}
#msg.err{color:var(--danger)}
</style>
</head>
<body>
<main>
  <h1>Informe de actividad pedagógica</h1>
  <p class="sub">Diligencie los campos y descargue el documento en Word (.docx).</p>

  <div class="card">
    <div class="row field">
      <div><label for="docente">Docente <span class="hint">(opcional)</span></label><input type="text" id="docente" autocomplete="name"></div>
      <div><label for="periodo">Periodo</label><input type="text" id="periodo" placeholder="Ej.: Primer periodo 2026"></div>
    </div>
    <div class="field"><label for="eje">Eje pedagógico</label><input type="text" id="eje"></div>
    <div class="field"><label for="objetivo">Objetivo</label><textarea id="objetivo"></textarea></div>
    <div class="field"><label for="actividad">Actividad</label><textarea id="actividad"></textarea></div>
    <div class="field"><label for="desarrollo">Desarrollo de la actividad</label><textarea id="desarrollo"></textarea></div>
  </div>

  <div class="card">
    <label>Evidencia fotográfica <span class="hint">(puede adjuntar varias fotos)</span></label>
    <label class="drop" for="fotos">📷 Toque aquí para seleccionar fotografías<input type="file" id="fotos" accept="image/*" multiple></label>
    <div class="grid" id="grid"></div>
  </div>

  <div class="actions">
    <button class="btn" id="gen">Generar y descargar Word</button>
    <button class="btn sec" id="clr">Limpiar formulario</button>
  </div>
  <div id="msg" role="status"></div>
</main>

<script>
(function(){
  var fotos=[];
  var $=function(id){return document.getElementById(id)};
  var msg=$('msg');
  function say(t,e){msg.textContent=t;msg.className=e?'err':''}

  function procesar(file){
    return new Promise(function(res,rej){
      var url=URL.createObjectURL(file),img=new Image();
      img.onload=function(){
        var M=1400,s=Math.min(1,M/Math.max(img.width,img.height));
        var w=Math.round(img.width*s),h=Math.round(img.height*s);
        var c=document.createElement('canvas');c.width=w;c.height=h;
        var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
        c.toBlob(function(b){
          URL.revokeObjectURL(url);
          if(!b)return rej(new Error('img'));
          b.arrayBuffer().then(function(buf){
            res({data:new Uint8Array(buf),w:w,h:h,prev:c.toDataURL('image/jpeg',.4),cap:''});
          });
        },'image/jpeg',.85);
      };
      img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('img'))};
      img.src=url;
    });
  }

  function pintar(){
    var g=$('grid');g.textContent='';
    fotos.forEach(function(f,i){
      var d=document.createElement('div');d.className='ph';
      var im=document.createElement('img');im.src=f.prev;im.alt='Foto '+(i+1);
      var t=document.createElement('input');t.type='text';t.placeholder='Descripción (opcional)';t.value=f.cap;
      t.oninput=function(){f.cap=t.value};
      var b=document.createElement('button');b.type='button';b.textContent='Quitar';
      b.onclick=function(){fotos.splice(i,1);pintar()};
      d.appendChild(im);d.appendChild(t);d.appendChild(b);g.appendChild(d);
    });
  }

  $('fotos').addEventListener('change',function(e){
    var files=Array.prototype.slice.call(e.target.files);
    e.target.value='';
    say('Procesando fotografías…');
    Promise.all(files.map(function(f){return procesar(f).catch(function(){return null})})).then(function(r){
      r.forEach(function(x){if(x)fotos.push(x)});
      pintar();
      say(r.indexOf(null)>-1?'Alguna imagen no se pudo leer.':'',r.indexOf(null)>-1);
    });
  });

  function parrafos(texto){
    var D=docx;
    var lines=(texto||'').split(/\r?\n/);
    return lines.map(function(l){
      return new D.Paragraph({children:[new D.TextRun({text:l,size:22})],spacing:{after:100},alignment:D.AlignmentType.JUSTIFIED});
    });
  }
  function titulo(t){
    var D=docx;
    return new D.Paragraph({
      children:[new D.TextRun({text:t,bold:true,size:24,color:'1F3F8F'})],
      spacing:{before:260,after:100},
      border:{bottom:{style:D.BorderStyle.SINGLE,size:6,color:'1F3F8F',space:2}}
    });
  }

  function construir(){
    var D=docx;
    var v=function(id){return $(id).value.trim()};
    var kids=[];
    kids.push(new D.Paragraph({alignment:D.AlignmentType.CENTER,spacing:{after:200},
      children:[new D.TextRun({text:'INFORME DE ACTIVIDAD PEDAGÓGICA',bold:true,size:32,color:'1F3F8F'})]}));

    function celda(txt,bold,w,fill){
      return new D.TableCell({
        width:{size:w,type:D.WidthType.PERCENTAGE},
        shading:fill?{type:D.ShadingType.CLEAR,fill:fill,color:'auto'}:undefined,
        margins:{top:80,bottom:80,left:120,right:120},
        children:[new D.Paragraph({children:[new D.TextRun({text:txt,bold:bold,size:22})]})]
      });
    }
    var filas=[];
    if(v('docente'))filas.push(['Docente:',v('docente')]);
    filas.push(['Periodo:',v('periodo')],['Eje pedagógico:',v('eje')]);
    kids.push(new D.Table({
      width:{size:100,type:D.WidthType.PERCENTAGE},
      rows:filas.map(function(f){return new D.TableRow({children:[celda(f[0],true,30,'E4ECFB'),celda(f[1],false,70)]})})
    }));

    kids.push(titulo('Objetivo'));parrafos(v('objetivo')).forEach(function(p){kids.push(p)});
    kids.push(titulo('Actividad'));parrafos(v('actividad')).forEach(function(p){kids.push(p)});
    kids.push(titulo('Desarrollo de la actividad'));parrafos(v('desarrollo')).forEach(function(p){kids.push(p)});
    kids.push(titulo('Evidencia fotográfica'));

    if(!fotos.length){
      kids.push(new D.Paragraph({children:[new D.TextRun({text:'Sin fotografías adjuntas.',italics:true,size:22})]}));
    }
    fotos.forEach(function(f,i){
      var s=Math.min(1,520/f.w,380/f.h);
      kids.push(new D.Paragraph({alignment:D.AlignmentType.CENTER,spacing:{before:160,after:60},keepNext:true,
        children:[new D.ImageRun({data:f.data,transformation:{width:Math.round(f.w*s),height:Math.round(f.h*s)}})]}));
      kids.push(new D.Paragraph({alignment:D.AlignmentType.CENTER,spacing:{after:140},
        children:[new D.TextRun({text:'Fotografía '+(i+1)+(f.cap.trim()?': '+f.cap.trim():''),italics:true,size:20,color:'555555'})]}));
    });

    return new D.Document({
      styles:{default:{document:{run:{font:'Calibri'}}}},
      sections:[{properties:{page:{margin:{top:1134,bottom:1134,left:1134,right:1134}}},children:kids}]
    });
  }

  $('gen').onclick=async function(){
    var btn=this;
    if(!$('periodo').value.trim()||!$('eje').value.trim()||!$('objetivo').value.trim()||!$('actividad').value.trim()||!$('desarrollo').value.trim()){
      say('Por favor complete Periodo, Eje pedagógico, Objetivo, Actividad y Desarrollo.',true);return;
    }
    if(typeof docx==='undefined'){say('No se pudo cargar el generador de Word. Recargue la página.',true);return;}
    btn.disabled=true;say('Generando documento…');
    try{
      var blob=await docx.Packer.toBlob(construir());
      var dl=null;
      try{dl=await claude.use('downloads')}catch(e){}
      if(!dl){say('La descarga no está disponible en esta vista. Abra la página desde su enlace en el navegador.',true);return;}
      var nom='Informe_'+($('periodo').value.trim().replace(/[^\wáéíóúñÁÉÍÓÚÑ]+/g,'_').slice(0,40)||'actividad')+'.docx';
      await dl.save({filename:nom,data:blob});
      say('✔ Documento generado: '+nom);
    }catch(err){
      if(err&&err.code==='declined')say('Descarga cancelada.');
      else say('No se pudo generar el documento. Intente de nuevo.',true);
    }finally{btn.disabled=false}
  };

  $('clr').onclick=function(){
    if(!confirm('¿Borrar todos los datos y fotografías?'))return;
    ['docente','periodo','eje','objetivo','actividad','desarrollo'].forEach(function(id){$(id).value=''});
    fotos=[];pintar();say('');
  };
})();
</script>
</body>
</html>
